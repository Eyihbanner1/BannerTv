packages:
  - apps/*
  # The native TV app installs with npm on its own (apps/tv/README.md), so it stays out of the lockfile.
  - '!apps/tv'
  - packages/*
  - services/*

# These install scripts are not needed: ssh2 builds an optional native speed-up,
# and the ares CLI keeps device settings in ~/.webos.
ignoredBuiltDependencies:
  - '@webos-tools/cli'
  - cpu-features
  - ssh2
