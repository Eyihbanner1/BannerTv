name: Deploy pair Worker

# Deploys services/pair, the phone pairing relay at pair.bannertv.workers.dev, from main. It runs
# only when started by hand (Actions, Deploy pair Worker, Run workflow), so nothing goes live by
# itself when a pull request merges. It needs the repository secret CLOUDFLARE_API_TOKEN, a
# Cloudflare API token made from the "Edit Cloudflare Workers" template, and, only if that token
# reaches more than one Cloudflare account, the repository variable CLOUDFLARE_ACCOUNT_ID. The
# relay has no secrets of its own.

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a second waits for the first rather than cancelling it.
concurrency:
  group: deploy-pair
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pair Worker
    # Production takes main only, whichever branch the run was started from.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the token is there
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the repository secret CLOUDFLARE_API_TOKEN (Settings, Secrets and variables, Actions) first."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter '@bannertv/pair...'

      - name: Typecheck
        run: pnpm --filter @bannertv/pair typecheck

      - name: Unit tests
        run: pnpm --filter @bannertv/pair test

      - name: Deploy
        working-directory: services/pair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npx --yes wrangler@4 deploy

      # The SubDL key page is up, and a SubDL key session opens with that page in its QR address.
      # The test session is never used and simply expires. Its answer holds the session's secret,
      # so only its kind and whether its page address is right are printed.
      - name: Check /subdl and a SubDL key session
        env:
          BASE: https://pair.bannertv.workers.dev
        run: |
          for attempt in 1 2 3 4 5 6; do
            page=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{content_type}' "$BASE/subdl" || true)
            session=$(curl -fsS --max-time 10 --data '' "$BASE/api/sessions?for=subdl-key" || true)
            if result=$(printf '%s' "$session" | node -e '
              let s = {};
              try {
                s = JSON.parse(require("fs").readFileSync(0, "utf8"));
              } catch {}
              const kind = s.kind === "subdl-key" || s.kind === "addon" ? s.kind : "none";
              const page = typeof s.pageUrl === "string" &&
                s.pageUrl.startsWith(process.env.BASE + "/subdl#code=");
              console.log("kind " + kind + ", page address " + (page ? "right" : "wrong"));
              process.exit(kind === "subdl-key" && page ? 0 : 1);
            '); then
              case "$page" in
                "200 text/html"*)
                  echo "/subdl: $page; SubDL key session: $result" | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
              esac
            fi
            echo "Attempt $attempt: /subdl answered ${page:-nothing}; SubDL key session: ${result:-no answer}"
            sleep 5
          done
          echo "::error::/subdl or a SubDL key session was not right after the deploy."
          exit 1
