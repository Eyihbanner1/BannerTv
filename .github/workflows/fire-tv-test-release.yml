name: Fire TV test release

# One-off, on this thread's branch only: builds the Android TV test APK and puts it on a public
# pre-release, so a Fire TV can download it with the Downloader app (no GitHub sign-in, no zip).
# Runs when this branch's Android shell or this file is pushed. The asset is replaced in place,
# so the download link stays the same.
#
# The web build comes from CI run WEB_RUN_ID, whose TV journeys passed on it. Only the Android
# shell (Kotlin) changed since, so this builds the APK here instead of re-running the journeys.

on:
  push:
    branches: [claude/project-thread-dm5j81]
    paths:
      - '.github/workflows/fire-tv-test-release.yml'
      - 'apps/androidtv/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: fire-tv-test-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Fire TV test APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_RUN_ID: '44759952348'
      TAG: fire-tv-test
      ASSET: bannertv.apk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Download the web build
        uses: actions/download-artifact@v4
        with:
          name: bannertv-web
          run-id: ${{ env.WEB_RUN_ID }}
          github-token: ${{ github.token }}
          path: apps/webos/dist

      # The same cache entry as CI's Android TV job, so the APK installs over the last one.
      - name: Debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Unit tests and build
        working-directory: apps/androidtv
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apps/androidtv/app/build/outputs/apk/debug/*-debug.apk "$ASSET"
          sha256sum "$ASSET" | tee "$ASSET.sha256"
          notes="Test build of BannerTV for Android TV, Google TV and Fire TV, from $GITHUB_SHA on $GITHUB_REF_NAME (web build from CI run $WEB_RUN_ID).
          Debug-signed: it installs as \"BannerTV test\". Not a store release.
          SHA-256: $(cut -d' ' -f1 "$ASSET.sha256")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" "$ASSET" --prerelease --target "$GITHUB_SHA" \
              --title "Fire TV test build" --notes "$notes"
          fi
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" >> "$GITHUB_STEP_SUMMARY"
