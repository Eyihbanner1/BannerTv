name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The TV app's checks run side by side: the build, the static checks and unit tests, and the
# remote-key journeys in four shards on the build. "Check, test and package" waits for all of
# them, fails unless every one passed, and only then packages the .ipk. It is the check to
# require. The Android TV APK waits for it, so no .ipk or Android TV APK is uploaded before the
# checks and every journey passed, as when they all ran in one job. The Phone APK does not wait
# for it: its own phone journeys gate it, as before.
jobs:
  web:
    name: Build the TV app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check the build for webOS 5.0
        run: pnpm check:bundle

      # The journeys run on this exact build, and the .ipk and the Android APK ship it, rather
      # than building their own. "Re-run failed jobs" does not run this job again once it has
      # passed, so the build is kept for as long as a re-run is likely.
      - name: Upload the web build
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-web
          path: apps/webos/dist
          retention-days: 14
          if-no-files-found: error

  checks:
    name: Format, lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version
        run: pnpm check:version

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  journeys:
    name: TV journeys ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard runs to the end, so one run shows every journey that fails.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download the web build
        uses: actions/download-artifact@v4
        with:
          name: bannertv-web
          path: apps/webos/dist

      - name: Install Playwright's Chromium
        run: pnpm --filter @bannertv/webos exec playwright install --with-deps chromium

      # Playwright splits the journeys by count, a quarter each. One worker, as on the 2-vCPU
      # runner before the split, so every journey keeps the timing it was written for. The blob
      # reporter's results come together in "TV journeys report".
      - name: Remote-key journeys
        run: >-
          pnpm --filter @bannertv/webos exec playwright test
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --workers=1
          --reporter=github,blob

      # Kept whether the journeys passed or not: a journey that failed and then passed on retry
      # leaves the job green, and its failed try's trace is only here.
      - name: Upload the journeys' results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/webos/blob-report/
          # As long as the web build, so a late re-run of the report still finds every shard.
          retention-days: 14
          if-no-files-found: ignore
          # A shard run again replaces its results.
          overwrite: true

  journeys-report:
    name: TV journeys report
    needs: journeys
    # Also after a failed shard, which is when the report matters most.
    if: ${{ !cancelled() && needs.journeys.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download the shards' results
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: apps/webos/blob-reports
          merge-multiple: true

      - name: Merge them into one report
        run: pnpm --filter @bannertv/webos exec playwright merge-reports --reporter html blob-reports

      # On every run, not only on failure, with the trace of each try that failed, including
      # the first try of a journey that passed on retry (trace: 'retain-on-failure').
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/webos/playwright-report/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  tv:
    name: Check, test and package
    needs: [web, checks, journeys]
    # Runs even when one of them failed or the run was cancelled, so that this check fails rather
    # than being skipped: a required check that was skipped counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every check passed
        if: ${{ always() && (needs.web.result != 'success' || needs.checks.result != 'success' || needs.journeys.result != 'success') }}
        run: |
          echo "::error::Build: ${{ needs.web.result }}. Checks: ${{ needs.checks.result }}. Journeys: ${{ needs.journeys.result }}."
          exit 1

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download the web build
        uses: actions/download-artifact@v4
        with:
          name: bannertv-web
          path: apps/webos/dist

      - name: Package .ipk
        run: pnpm package

      - name: Upload .ipk
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-ipk
          path: out/*.ipk
          if-no-files-found: error

  android:
    name: Android APK
    # Only once "Check, test and package" passed, so every APK here passed the TV checks and
    # journeys. It ships the web build those journeys ran on.
    needs: tv
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Download the web build
        uses: actions/download-artifact@v4
        with:
          name: bannertv-web
          path: apps/webos/dist

      # Every APK must carry the same certificate or Android refuses it as an update, so release
      # builds use the one keystore kept in secrets. Pull requests from forks get no secrets and
      # build debug only.
      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'No release key here, so only the debug APK will be built.'
            exit 0
          fi
          keystore="$RUNNER_TEMP/bannertv-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # Android takes a new debug build over an old one only when both carry the same key, and
      # Gradle makes a fresh debug key on every runner. Kept in the cache, not the repository.
      - name: Debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Unit tests
        working-directory: apps/androidtv
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build
        working-directory: apps/androidtv
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tasks=(assembleDebug)
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            # Gradle falls back to the debug key without all four, which would pass off a
            # debug-signed APK as the release.
            for secret in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!secret}" ]; then
                echo "::error::The release key is set but the secret $secret is not."
                exit 1
              fi
            done
            tasks+=(assembleRelease)
          fi
          ./gradlew --no-daemon "${tasks[@]}"

      # The patterns skip app-release-unsigned.apk, and cp fails on no match or on several.
      - name: Collect the APKs
        run: |
          version=$(node -p "require('./apps/webos/webos-meta/appinfo.json').version")
          apks=apps/androidtv/app/build/outputs/apk
          mkdir -p apps/androidtv/out
          cp "$apks"/debug/*-debug.apk "apps/androidtv/out/bannertv-$version-debug.apk"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            cp "$apks"/release/*-release.apk "apps/androidtv/out/bannertv-$version-release.apk"
          fi

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-apk
          path: apps/androidtv/out/*.apk
          if-no-files-found: error

      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: apps/androidtv/app/build/reports/
          if-no-files-found: ignore

  # The phone app (apps/mobile, ADR 0007): React Native through Expo. Its native Android project is
  # generated from app.config.ts on every run (`expo prebuild`) rather than kept in the repository.
  mobile:
    name: Phone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Touch journeys on the web build with the TV journeys' fake addons, before the long
      # Android build: every screen opens and a film plays. Here rather than in a job of their
      # own, so no phone APK is uploaded unless they passed.
      - name: Phone journeys
        working-directory: apps/mobile
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm export:web
          pnpm e2e

      - name: Upload the journeys' traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-journeys
          path: apps/mobile/test-results/
          if-no-files-found: ignore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # On a pull request setup-gradle only reads the cache unless told otherwise, and this job is
      # not on main yet, so nothing was ever saved for it. Saved here, the Gradle wrapper,
      # dependencies and transforms come back on the pull request's next run. The C++ builds
      # are not cached by Gradle at all.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --no-install

      # A release build, so the JavaScript is inside the APK and it runs without a computer
      # attached. Signed with the debug key the Expo template ships, which is the same on every
      # run, so each test APK installs over the last. Not for the store. 64-bit Arm only, the
      # phones it is tested on (a Galaxy S25 Ultra runs nothing else): each architecture's C++
      # is built in full, and 32-bit Arm cost about 7 to 10 of the build's 32 minutes. Add
      # armeabi-v7a back to PHONE_ABIS (comma-separated) for a 32-bit-only phone.
      - name: Build
        working-directory: apps/mobile/android
        env:
          PHONE_ABIS: arm64-v8a
        run: ./gradlew --no-daemon assembleRelease "-PreactNativeArchitectures=$PHONE_ABIS"

      - name: Collect the APK
        run: |
          version=$(node -p "require('./apps/webos/webos-meta/appinfo.json').version")
          mkdir -p apps/mobile/out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "apps/mobile/out/bannertv-phone-$version-test.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-phone-apk
          path: apps/mobile/out/*.apk
          if-no-files-found: error

      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-android-reports
          path: apps/mobile/android/app/build/reports/
          if-no-files-found: ignore
