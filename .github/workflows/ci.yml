name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version
        run: pnpm check:version

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the build for webOS 5.0
        run: pnpm check:bundle

      # The Android job ships this exact build inside its APK rather than building its own.
      - name: Upload the web build
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-web
          path: apps/webos/dist
          retention-days: 3
          if-no-files-found: error

      - name: Install Playwright's Chromium
        run: pnpm --filter @bannertv/webos exec playwright install --with-deps chromium

      - name: Remote-key journeys
        run: pnpm e2e

      - name: Package .ipk
        run: pnpm package

      - name: Upload .ipk
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-ipk
          path: out/*.ipk
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/webos/playwright-report/
            apps/webos/test-results/
          if-no-files-found: ignore

  android:
    name: Android APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Download the web build
        uses: actions/download-artifact@v4
        with:
          name: bannertv-web
          path: apps/webos/dist

      # Every APK must carry the same certificate or Android refuses it as an update, so release
      # builds use the one keystore kept in secrets. Pull requests from forks get no secrets and
      # build debug only.
      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'No release key here, so only the debug APK will be built.'
            exit 0
          fi
          keystore="$RUNNER_TEMP/bannertv-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # Android takes a new debug build over an old one only when both carry the same key, and
      # Gradle makes a fresh debug key on every runner. Kept in the cache, not the repository.
      - name: Debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Unit tests
        working-directory: apps/androidtv
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build
        working-directory: apps/androidtv
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tasks=(assembleDebug)
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            # Gradle falls back to the debug key without all four, which would pass off a
            # debug-signed APK as the release.
            for secret in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!secret}" ]; then
                echo "::error::The release key is set but the secret $secret is not."
                exit 1
              fi
            done
            tasks+=(assembleRelease)
          fi
          ./gradlew --no-daemon "${tasks[@]}"

      # The patterns skip app-release-unsigned.apk, and cp fails on no match or on several.
      - name: Collect the APKs
        run: |
          version=$(node -p "require('./apps/webos/webos-meta/appinfo.json').version")
          apks=apps/androidtv/app/build/outputs/apk
          mkdir -p apps/androidtv/out
          cp "$apks"/debug/*-debug.apk "apps/androidtv/out/bannertv-$version-debug.apk"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            cp "$apks"/release/*-release.apk "apps/androidtv/out/bannertv-$version-release.apk"
          fi

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-apk
          path: apps/androidtv/out/*.apk
          if-no-files-found: error

      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: apps/androidtv/app/build/reports/
          if-no-files-found: ignore

  # A throwaway app for the LG, outside the pnpm workspace:
  # Home drawn by a WebGL renderer against HTML, with the same motion. See trials/motion-home.
  motion-trial:
    name: Motion trial .ipk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: trials/motion-home
    steps:
      - uses: actions/checkout@v5

      # The root package.json names pnpm, which setup-node would otherwise try to cache.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Its direct dependencies are pinned exactly; it keeps no lockfile of its own.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the build for webOS 5.0
        run: npm run check:bundle

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Walk every mode in Chromium
        run: npm run e2e

      - name: Package .ipk
        run: npm run package

      - name: Upload .ipk
        uses: actions/upload-artifact@v4
        with:
          name: motion-trial-ipk
          path: trials/motion-home/out/*.ipk
          if-no-files-found: error
