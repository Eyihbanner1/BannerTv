name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version
        run: pnpm check:version

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the build for webOS 5.0
        run: pnpm check:bundle

      - name: Install Playwright's Chromium
        run: pnpm --filter @bannertv/webos exec playwright install --with-deps chromium

      - name: Remote-key journeys
        run: pnpm e2e

      - name: Package .ipk
        run: pnpm package

      - name: Upload .ipk
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-ipk
          path: out/*.ipk
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/webos/playwright-report/
            apps/webos/test-results/
          if-no-files-found: ignore
