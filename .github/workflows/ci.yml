name: CI

# The repository is private on GitHub Free, so CI has 2,000 minutes a month. Every push runs one
# quick check: format, lint, typecheck, unit tests and the TV build. The long jobs (the TV journeys
# and .ipk, the Android TV APK and the phone APK) run only for a build someone will install, called
# a full build here:
# - every push to the combined test build (the test/all-together branch);
# - once each time the full-ci label is added to a pull request (later pushes are quick again, so
#   remove and add the label for another full build);
# - a run started by hand from the Actions tab (Run workflow).
# Pushes to main run the quick check only: what reaches main has passed a full build already.
# On a full-ci pull request whose phone native side is unchanged, the phone job runs its journeys
# and checks the Android bundle but builds no APK (job `mobile` says why). Adding the phone-apk
# label instead runs the quick check and the phone job alone, and always builds the APK: that is
# the way to put one pull request on a phone.
#
# One file serves every branch: a job whose app a branch does not have skips itself.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

# A newer push replaces a quick check still running on the same branch. A full build has a group of
# its own, so a quick push does not cancel it, though a newer full build on the same branch does.
# A phone-apk run has a group of its own too. Adding any other label starts a run that does
# nothing, in a group of its own.
concurrency:
  group: >-
    ci-${{ github.ref }}-${{
    (github.event.action == 'labeled' && github.event.label.name == 'phone-apk') && 'phone'
    || (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && 'label'
    || ((github.event_name == 'workflow_dispatch' || github.head_ref == 'test/all-together'
    || github.event.label.name == 'full-ci') && 'full' || 'quick') }}
  cancel-in-progress: true

permissions:
  contents: read
  # The plan step lists a labelled pull request's files.
  pull-requests: read

jobs:
  quick:
    name: Quick check
    if: >-
      github.event.action != 'labeled'
      || github.event.label.name == 'full-ci' || github.event.label.name == 'phone-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.plan.outputs.full }}
      androidtv: ${{ steps.plan.outputs.androidtv }}
      phone: ${{ steps.plan.outputs.phone }}
    steps:
      - uses: actions/checkout@v5

      # Whether this run is a full build, and which apps it builds. The phone job needs a branch
      # with the phone app, and on a full-ci pull request a change to a file the phone build
      # reads: the TV app's data layer (apps/webos/src) and version (webos-meta), the brand
      # tokens, and the stream helper's Kotlin core it compiles from apps/androidtv/helper-core.
      # The phone-apk label runs the phone job alone, with no full build.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          full=false
          if [ "$LABEL" != phone-apk ] && { [ "$EVENT" = workflow_dispatch ] ||
            [ "$HEAD_REF" = test/all-together ] || [ "$LABEL" = full-ci ]; }; then
            full=true
          fi
          androidtv=false
          if [ "$full" = true ] && [ -d apps/androidtv ]; then
            androidtv=true
          fi
          phone=false
          if [ "$LABEL" = phone-apk ] && [ -f apps/mobile/package.json ]; then
            phone=true
          elif [ "$full" = true ] && [ -f apps/mobile/package.json ]; then
            phone=true
            if [ "$LABEL" = full-ci ]; then
              if files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'); then
                shared='^(apps/mobile/|apps/webos/(src|e2e|webos-meta)/|apps/androidtv/helper-core/|brand/tokens/|packages/|\.github/workflows/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|(.*/)?\.npmrc$)'
                if ! grep -Eq "$shared" <<< "$files"; then
                  phone=false
                fi
              else
                echo "::warning::Could not list the pull request's files, so the phone APK is built anyway."
              fi
            fi
          fi
          {
            echo "full=$full"
            echo "androidtv=$androidtv"
            echo "phone=$phone"
          } >> "$GITHUB_OUTPUT"
          echo "Full build: $full. Android TV APK: $androidtv. Phone job: $phone." >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version
        run: pnpm check:version

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the build for webOS 5.0
        run: pnpm check:bundle

      # The journeys run on this exact build, and the .ipk and the Android TV APK ship it.
      - name: Upload the web build
        if: steps.plan.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-web
          path: apps/webos/dist
          retention-days: 3
          if-no-files-found: error

  tv:
    name: TV journeys and .ipk
    needs: quick
    if: needs.quick.outputs.full == 'true'
    runs-on: ubuntu-latest
    # The journeys alone take 17 to 22 minutes; a 20-minute limit cut eight runs short.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download the web build
        uses: actions/download-artifact@v4
        with:
          name: bannertv-web
          path: apps/webos/dist

      - name: Install Playwright's Chromium
        run: pnpm --filter @bannertv/webos exec playwright install --with-deps chromium

      - name: Remote-key journeys
        run: pnpm e2e

      - name: Package .ipk
        run: pnpm package

      - name: Upload .ipk
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-ipk
          path: out/*.ipk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/webos/playwright-report/
            apps/webos/test-results/
          retention-days: 3
          if-no-files-found: ignore

  android:
    name: Android TV APK
    # Only once the journeys passed, so every APK here passed them. It ships the web build they ran on.
    needs: [quick, tv]
    if: needs.quick.outputs.androidtv == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Download the web build
        uses: actions/download-artifact@v4
        with:
          name: bannertv-web
          path: apps/webos/dist

      # Every APK must carry the same certificate or Android refuses it as an update, so release
      # builds use the one keystore kept in secrets. Pull requests from forks get no secrets and
      # build debug only.
      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'No release key here, so only the debug APK will be built.'
            exit 0
          fi
          keystore="$RUNNER_TEMP/bannertv-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # Android takes a new debug build over an old one only when both carry the same key, and
      # Gradle makes a fresh debug key on every runner. Kept in the cache, not the repository.
      - name: Debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Unit tests
        working-directory: apps/androidtv
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build
        working-directory: apps/androidtv
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tasks=(assembleDebug)
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            # Gradle falls back to the debug key without all four, which would pass off a
            # debug-signed APK as the release.
            for secret in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!secret}" ]; then
                echo "::error::The release key is set but the secret $secret is not."
                exit 1
              fi
            done
            tasks+=(assembleRelease)
          fi
          ./gradlew --no-daemon "${tasks[@]}"

      # The patterns skip app-release-unsigned.apk, and cp fails on no match or on several.
      - name: Collect the APKs
        run: |
          version=$(node -p "require('./apps/webos/webos-meta/appinfo.json').version")
          apks=apps/androidtv/app/build/outputs/apk
          mkdir -p apps/androidtv/out
          cp "$apks"/debug/*-debug.apk "apps/androidtv/out/bannertv-$version-debug.apk"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            cp "$apks"/release/*-release.apk "apps/androidtv/out/bannertv-$version-release.apk"
          fi

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-apk
          path: apps/androidtv/out/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: apps/androidtv/app/build/reports/
          retention-days: 3
          if-no-files-found: ignore

  # The phone app (apps/mobile, ADR 0007): React Native through Expo. Its native Android project is
  # generated from app.config.ts on every run (`expo prebuild`) rather than kept in the repository.
  # It waits for the quick check only: its own phone journeys gate the APK.
  mobile:
    name: Phone APK
    needs: quick
    if: needs.quick.outputs.phone == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's test merge commit and its first parent, the base the native side is
          # compared with.
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Whether this run needs the Android build, about 20 of the job's minutes. Expo's native
      # fingerprint hashes what that build reads: the app config, every native module and its
      # version, the config plugins, the icons and fonts, and what apps/mobile/fingerprint.config.js
      # adds (the images folder, the stream helper's Kotlin core, the Expo tools that write the
      # Android project), never the JavaScript. A full-ci pull request whose fingerprint matches its
      # base's gets the journeys and an Android bundle check below, but no APK. These always build
      # one: the phone-apk label, the combined test build, a run started by hand, and a pull request
      # that changes what the fingerprint does not cover (this job's part of this file, a local
      # action, app.config.ts, the fingerprint settings, the app version, pnpm's settings, patches
      # or .npmrc). So does anything going wrong in the comparison, including a fingerprint that
      # lacks the sources it should have (the tool leaves out what it cannot read, and drops a
      # fingerprint.config.js that fails to load, without failing).
      - name: Native side
        id: native
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          # Only the run the label's adding starts, as with full-ci: a label left on the pull request
          # does not turn a later full-ci run into an APK build.
          WANT_APK: ${{ github.event.label.name == 'phone-apk' }}
        run: |
          fingerprint() {
            (cd "$1/apps/mobile" && pnpm exec fingerprint fingerprint:generate --platform android) |
              node -e '
                const f = JSON.parse(require("fs").readFileSync(0, "utf8"));
                const reasons = new Set(f.sources.flatMap((s) => s.reasons));
                for (const r of ["expoConfig", "expoAutolinkingAndroid", "rncoreAutolinkingAndroid", "buildTools"]) {
                  if (!reasons.has(r)) throw new Error("the fingerprint has no " + r + " source");
                }
                process.stdout.write(f.hash);'
          }
          # This file's top-level settings and this job, without comments or blank lines: a change
          # to another job does not touch the APK.
          phone_job() {
            git show "$1:.github/workflows/ci.yml" |
              awk -v job="$GITHUB_JOB" '/^[[:space:]]*(#|$)/ { next }
                /^[^ ]/ { jobs = ($0 ~ /^jobs:/) } !jobs { print; next }
                /^  [A-Za-z0-9_-]+:/ { mine = ($0 ~ ("^  " job ":[[:space:]]*(#.*)?$")) } mine { print }'
          }
          # pnpm's settings, overrides and patches sit at the top of the lockfile.
          lock_head() {
            git show "$1:pnpm-lock.yaml" | sed '/^importers:/q'
          }
          build=true
          if [ "$EVENT" != pull_request ] || [ "$HEAD_REF" = test/all-together ]; then
            why='this is the combined test build or a run started by hand'
          elif [ "$WANT_APK" = true ]; then
            why='the phone-apk label was added'
          elif ! git rev-parse -q --verify HEAD^2 > /dev/null; then
            why='there is no base commit to compare with'
          elif ! phone_job HEAD | grep -q "^  $GITHUB_JOB:"; then
            why="job $GITHUB_JOB was not found in ci.yml"
          elif [ "$(phone_job HEAD^1)" != "$(phone_job HEAD)" ]; then
            why='the phone job in ci.yml changed'
          elif [ "$(lock_head HEAD^1)" != "$(lock_head HEAD)" ]; then
            why="pnpm's settings, overrides or patches in the lockfile changed"
          elif ! changed=$(git diff --name-only HEAD^1 HEAD -- .github/actions apps/mobile/app.config.ts \
            apps/mobile/fingerprint.config.js apps/webos/webos-meta/appinfo.json pnpm-workspace.yaml \
            patches .npmrc apps/mobile/.npmrc); then
            why='the file comparison failed'
          elif [ -n "$changed" ]; then
            why="${changed//$'\n'/, } changed"
          elif ! head=$(fingerprint "$GITHUB_WORKSPACE"); then
            why='the fingerprint failed'
          elif ! git cat-file -e HEAD^1:apps/mobile/package.json 2> /dev/null; then
            why='the base has no phone app'
          elif ! git worktree add --detach "$RUNNER_TEMP/base" HEAD^1 ||
            ! (cd "$RUNNER_TEMP/base" &&
              pnpm install --frozen-lockfile --prefer-offline --filter '@bannertv/mobile...') ||
            ! base=$(fingerprint "$RUNNER_TEMP/base"); then
            why="the base's fingerprint failed"
          elif [ "$head" != "$base" ]; then
            why="the native side changed (fingerprint $base to $head)"
          else
            build=false
            why="nothing the Android build reads changed (native fingerprint $head, the same as the base's)"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ "$build" = true ]; then
            echo "Phone APK: building one, because $why." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No phone APK: $why. Add the phone-apk label for one (remove it first if it is on)." |
              tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Touch journeys on the web build with the TV journeys' fake addons, before the long
      # Android build: every screen opens and a film plays. Here rather than in a job of their
      # own, so no phone APK is uploaded unless they passed.
      - name: Phone journeys
        working-directory: apps/mobile
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm export:web
          pnpm e2e

      - name: Upload the journeys' traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-journeys
          path: apps/mobile/test-results/
          retention-days: 3
          if-no-files-found: ignore

      # Without the Android build nothing else bundles the JavaScript for Android: the journeys use
      # the web build, which leaves out the phone's own stand-ins (src/shims, swapped in by
      # metro.config.js). Metro for Android and Hermes, as the APK's bundle step runs them.
      - name: Check the Android bundle
        if: steps.native.outputs.build != 'true'
        working-directory: apps/mobile
        run: pnpm export:android

      - uses: actions/setup-java@v4
        if: steps.native.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 17

      # On a pull request setup-gradle only reads the cache unless told otherwise. Saved here, the
      # Gradle wrapper, dependencies and transforms come back on the pull request's next run. The
      # C++ builds are not cached by Gradle at all.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.native.outputs.build == 'true'
        with:
          cache-read-only: false

      - name: Generate the Android project
        if: steps.native.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --no-install

      # A release build, so the JavaScript is inside the APK and it runs without a computer
      # attached. Signed with the debug key the Expo template ships, which is the same on every
      # run, so each test APK installs over the last. Not for the store. 64-bit Arm only, the
      # phones it is tested on: each architecture's C++ is built in full, and 32-bit Arm cost about
      # 7 to 10 minutes of each build. Add armeabi-v7a back to PHONE_ABIS (comma-separated) for a
      # 32-bit-only phone.
      # Three more cuts for a test APK installed by hand, about 4 minutes of each build (Gradle took
      # 18m 45s on PR #48, against 22m 50s before):
      # - no R8: Expo SDK 58's template turns code shrinking on in gradle.properties, and it took
      #   about 6 minutes; D8 dexes the code instead, in about 2, as on SDK 57 and earlier (-P
      #   outranks that file). Resource shrinking needs R8, so it is held off too. Turn both back
      #   on, and run the store build's checks, before any store release;
      # - no lint vital, the check that gates store builds;
      # - the app alone (:app:), not every library's own .aar as well.
      - name: Build
        if: steps.native.outputs.build == 'true'
        working-directory: apps/mobile/android
        env:
          PHONE_ABIS: arm64-v8a
        run: |
          ./gradlew --no-daemon :app:assembleRelease "-PreactNativeArchitectures=$PHONE_ABIS" \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false -x lintVitalRelease

      - name: Collect the APK
        if: steps.native.outputs.build == 'true'
        run: |
          version=$(node -p "require('./apps/webos/webos-meta/appinfo.json').version")
          mkdir -p apps/mobile/out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "apps/mobile/out/bannertv-phone-$version-test.apk"

      - name: Upload the APK
        if: steps.native.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bannertv-phone-apk
          path: apps/mobile/out/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Gradle reports
        if: failure() && steps.native.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phone-android-reports
          path: apps/mobile/android/app/build/reports/
          retention-days: 3
          if-no-files-found: ignore
